# Build inputs only. Everything the publish pipeline needs (project ids, MC windows,
# display names, Discord styling, dependencies) lives in .github/moogs-publish.yml on the
# repository's default branch. Keys are snake_case fleet-wide.
org.gradle.jvmargs=-Xmx2G

# Project
mod_id=mbs
mod_name=MoogsBountifulStructures
mod_version=1.0.11
mod_description=A vanilla style structure mod adding ~150 structures built for the Biomes O' Plenty mod

# Minecraft
minecraft_version=1.21

# Metadata links expanded into fabric.mod.json / quilt.mod.json / mods.toml / pack.mcmeta
mod_homepage=https://www.curseforge.com/minecraft/mc-mods/mbs-moogs-bountiful-structures
mod_sources=https://github.com/FinnSetchell/MoogsBountifulStructures
mod_releases=https://github.com/FinnSetchell/MoogsBountifulStructures/releases
mod_issues=https://github.com/FinnSetchell/MoogsBountifulStructures/issues
mod_discord=https://discord.gg/S5nffJbuvA
mod_kofi=https://ko-fi.com/finndog
mod_curseforge=https://www.curseforge.com/minecraft/mc-mods/mbs-moogs-bountiful-structures
mod_modrinth=https://modrinth.com/mod/mbs-moogs-bountiful-structures

# Structure Lib dependency range (forge/neoforge mods.toml)
structure_lib_version_range=[1.0.0,)
