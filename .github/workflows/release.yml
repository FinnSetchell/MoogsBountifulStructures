name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate Structures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install nbtlib

      - name: Check NBT integrity
        run: python scripts/nbt_check.py

      - name: Check loot tables
        run: python scripts/check_loot_tables.py

      - name: Check data integrity
        run: python scripts/check_data_integrity.py

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Publish mod
        run: ./gradlew publishMods
        env:
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
